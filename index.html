<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Сборник НПА для курсантов</title>
<meta name="theme-color" content="#14325c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
:root{
  --bg:#f3f5f9; --card:#fff; --ink:#152033; --muted:#5f6b7f; --line:#e1e6ee;
  --navy:#14325c; --navy2:#1f4c8a; --gold:#b8892e; --hl:#ffe58a; --tap:#eaf0fa;
  --fs:17px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
button{font:inherit;color:inherit}
a{color:var(--navy2)}
.wrap{max-width:760px;margin:0 auto;padding:0 14px}

/* ---------- Главная ---------- */
.hero{background:linear-gradient(160deg,#0f2747 0%,#14325c 55%,#1f4c8a 100%);color:#fff;padding:calc(26px + env(safe-area-inset-top)) 0 30px;text-align:center;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.emblem{width:54px;height:54px;margin:0 auto 12px;display:block;opacity:.95}
.hero h1{font-size:21px;line-height:1.3;margin:0 0 12px;font-weight:700;letter-spacing:.2px}
.hero .uni{font-size:12.5px;line-height:1.45;letter-spacing:.6px;text-transform:uppercase;opacity:.9;margin:0 auto;max-width:520px;font-weight:600}
.hero .by{display:inline-block;margin-top:14px;font-size:11.5px;opacity:.6;letter-spacing:.5px}

.gsearch{margin:-22px auto 0;position:relative;z-index:2}
.field{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:0 12px;box-shadow:0 6px 20px rgba(20,50,92,.10)}
.field svg{flex:none;color:var(--muted)}
.field input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:16px;padding:14px 0;color:var(--ink)}
.field .clear{border:0;background:none;padding:6px;color:var(--muted);display:none;cursor:pointer}
.field.has .clear{display:block}

.sec-title{font-size:13px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin:24px 2px 10px;font-weight:700}
.npa-list{display:flex;flex-direction:column;gap:12px}
.npa-btn{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;cursor:pointer;transition:transform .08s,box-shadow .2s;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.npa-btn:active{transform:scale(.985);background:var(--tap)}
.npa-ico{flex:none;width:50px;height:50px;border-radius:12px;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:800;font-size:14px;letter-spacing:.3px}
.npa-ico.alt{background:var(--gold)}
.npa-txt{flex:1;min-width:0}
.npa-txt b{display:block;font-size:17px;line-height:1.25}
.npa-txt span{display:block;font-size:13px;color:var(--muted);margin-top:3px;line-height:1.35}
.npa-txt em{display:block;font-style:normal;font-size:12px;color:var(--navy2);margin-top:4px}
.chev{flex:none;color:#a8b2c3}
.npa-btn.off{opacity:.55}

.favs{display:flex;flex-direction:column;gap:8px}
.fav{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 13px;cursor:pointer;text-align:left;width:100%}
.fav small{color:var(--muted);flex:none;font-weight:700;font-size:12px}
.fav span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14.5px}
.foot{text-align:center;color:var(--muted);font-size:12px;padding:30px 0 calc(30px + env(safe-area-inset-bottom))}

/* ---------- Верхняя панель ---------- */
.bar{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;padding-top:env(safe-area-inset-top);box-shadow:0 2px 10px rgba(0,0,0,.15)}
.bar-row{display:flex;align-items:center;gap:6px;height:54px}
.ib{border:0;background:none;color:inherit;width:42px;height:42px;border-radius:10px;display:grid;place-items:center;cursor:pointer;flex:none}
.ib:active{background:rgba(255,255,255,.15)}
.bar-title{flex:1;min-width:0;font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-title small{display:block;font-weight:400;font-size:11.5px;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-search{padding:0 0 10px}
.bar-search .field{box-shadow:none;border:0;border-radius:11px}
.bar-search .field input{padding:11px 0}

/* ---------- Оглавление ---------- */
.toc{padding:10px 0 40px}
.grp{margin:8px 0}
.grp>button{width:100%;text-align:left;border:0;background:var(--card);border:1px solid var(--line);padding:12px 14px;border-radius:12px;display:flex;gap:10px;align-items:center;cursor:pointer}
.grp>button .t{flex:1;font-weight:700;font-size:14.5px;line-height:1.3}
.grp>button .t small{display:block;font-weight:600;font-size:11.5px;color:var(--gold);text-transform:uppercase;letter-spacing:.5px;margin-bottom:2px}
.grp>button .n{font-size:12px;color:var(--muted);flex:none}
.grp>button svg{flex:none;transition:transform .2s;color:var(--muted)}
.grp.open>button svg{transform:rotate(90deg)}
.grp.open>button{border-radius:12px 12px 0 0;border-bottom-color:transparent}
.arts{display:none;background:var(--card);border:1px solid var(--line);border-top:0;border-radius:0 0 12px 12px;overflow:hidden}
.grp.open .arts{display:block}
.part-h{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.7px;color:var(--navy2);margin:22px 4px 6px}
.art-link{display:flex;gap:10px;width:100%;text-align:left;border:0;background:none;padding:11px 14px;border-top:1px solid var(--line);cursor:pointer;font-size:14.5px;line-height:1.35}
.art-link:first-child{border-top:0}
.art-link:active{background:var(--tap)}
.art-link b{flex:none;min-width:44px;color:var(--navy2);font-weight:700}
.art-link.lost{color:var(--muted)}

/* ---------- Результаты поиска ---------- */
.res-info{font-size:13px;color:var(--muted);margin:12px 2px 8px}
.res{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;cursor:pointer}
.res:active{background:var(--tap)}
.res .h{font-weight:700;font-size:14.5px;line-height:1.3}
.res .h i{font-style:normal;color:var(--navy2)}
.res .tag{display:inline-block;font-size:10.5px;font-weight:800;color:#fff;background:var(--navy);border-radius:5px;padding:1px 6px;margin-right:6px;vertical-align:1px}
.res .tag.alt{background:var(--gold)}
.res .s{font-size:13.5px;color:#3a4558;margin-top:5px;line-height:1.45}
.res.direct{border:2px solid var(--navy2)}
mark{background:var(--hl);color:inherit;border-radius:3px;padding:0 1px}
.more{width:100%;padding:12px;border:1px dashed #b9c3d4;background:none;border-radius:12px;color:var(--navy2);font-weight:600;cursor:pointer;margin:4px 0 30px}
.empty{text-align:center;color:var(--muted);padding:40px 10px}

/* ---------- Статья ---------- */
.article{padding:16px 0 120px}
.a-crumb{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;line-height:1.4}
.a-title{font-size:calc(var(--fs) + 3px);line-height:1.3;margin:6px 0 16px}
.a-body{font-size:var(--fs);line-height:1.62}
.a-body p{margin:0 0 .75em;text-align:left;hyphens:auto;-webkit-hyphens:auto}
.a-body p.note{font-size:.8em;color:var(--muted);line-height:1.45}
.a-body p.cons{font-size:.8em;background:#f6f1e4;border-left:3px solid var(--gold);padding:8px 10px;border-radius:6px;color:#5a4a26}
.a-body p.lost{color:var(--muted);font-style:italic}
.a-nav{position:fixed;left:0;right:0;bottom:0;z-index:15;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom))}
.a-nav .wrap{display:flex;gap:8px;padding:0}
.a-nav button{flex:1;min-width:0;border:1px solid var(--line);background:var(--card);border-radius:11px;padding:9px 8px;font-size:13px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.a-nav button:disabled{opacity:.35}
.a-nav button:active{background:var(--tap)}
.hl-nav{display:none;align-items:center;gap:4px;background:rgba(255,255,255,.15);border-radius:10px;padding:0 4px;font-size:12px}
.hl-nav.on{display:flex}
.hl-nav .ib{width:32px;height:32px}
mark.cur{background:#ffb238}

.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:#1d2635;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:50}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.loading{padding:60px 0;text-align:center;color:var(--muted)}
.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--navy2);border-radius:50%;margin:0 auto 12px;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.hide{display:none!important}

@media (min-width:700px){
  .hero h1{font-size:26px}
  .hero .uni{font-size:13.5px}
}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>

<script>
/* ======================= Реестр НПА =======================
   Чтобы добавить новый НПА: положи data/<id>.json (собирается
   скриптом build.py) и добавь строку сюда. */
const NPA = [
  { id:'fzop', short:'ФЗ «О полиции»', badge:'3-ФЗ',
    full:'Федеральный закон от 07.02.2011 N 3-ФЗ "О полиции"', edition:'ред. от 04.08.2026' },
  { id:'koap', short:'КоАП РФ', badge:'КоАП', alt:true,
    full:'Кодекс Российской Федерации об административных правонарушениях от 30.12.2001 N 195-ФЗ', edition:'ред. от 04.08.2026, вступ. в силу с 03.11.2026' },
];

/* ======================= Утилиты ======================= */
const $ = s => document.querySelector(s);
const app = $('#app');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm = s => s.toLowerCase().replace(/ё/g,'е');
const ICON = {
  search:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',
  x:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>',
  back:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
  chev:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>',
  star:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg>',
  starf:'<svg width="22" height="22" viewBox="0 0 24 24" fill="#f4c542" stroke="#f4c542" stroke-width="2" stroke-linejoin="round"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg>',
  font:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 19 8.5 5 14 19M5 14h7M16 19l3-8 3 8M17 16.5h4"/></svg>',
  up:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="m6 15 6-6 6 6"/></svg>',
  down:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg>',
  share:'<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M10 14a4 4 0 0 0 5.7 0l3.5-3.5a4 4 0 0 0-5.7-5.7L12 6.3M14 10a4 4 0 0 0-5.7 0l-3.5 3.5a4 4 0 0 0 5.7 5.7l1.5-1.5"/></svg>',
};
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on'),1700)}
const store = {
  get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
let fs = store.get('fs',17); document.documentElement.style.setProperty('--fs',fs+'px');

/* ======================= Загрузка данных ======================= */
const cache = {};
async function load(id){
  if(cache[id]) return cache[id];
  const r = await fetch('data/'+id+'.json');
  if(!r.ok) throw new Error('nodata');
  const d = await r.json();
  if(d.parts){ for(const pn of d.parts){ const pr=await fetch('data/'+pn); if(!pr.ok) throw new Error('nodata'); d.items.push(...await pr.json()) } }
  // подготовка: плоский список статей, индекс для поиска
  const arts = []; let ctx = {};
  for(const it of d.items){
    if(it.type==='article'){
      const a = {...it, idx:arts.length, path:[ctx.part,ctx.section,ctx.chapter].filter(Boolean)};
      a.plain = a.text.join('\n');
      a.ntitle = norm('статья '+a.num+'. '+a.title);
      a.nbody = norm(a.plain);
      arts.push(a);
    } else {
      if(it.type==='part'){ctx={part:it}}
      else if(it.type==='section'){ctx={part:ctx.part,section:it}}
      else if(it.type==='chapter'){ctx={...ctx,chapter:it}}
    }
  }
  d.arts = arts;
  d.byNum = Object.fromEntries(arts.map(a=>[a.num,a]));
  return cache[id]=d;
}

/* ======================= Поиск ======================= */
// окончание отрезаем, чтобы «задержания» находило «задержание», «задержанного» и т.д.
function stem(w){
  if(/^\d/.test(w)) return w;
  if(w.length>=7) return w.slice(0,-2);
  if(w.length>=5) return w.slice(0,-1);
  return w;
}
function parseQuery(q){
  q = norm(q).trim();
  const phrases = [];
  q = q.replace(/"([^"]+)"/g,(m,p)=>{phrases.push(p.trim());return ' '});
  const words = q.split(/[^0-9a-zа-я.\-]+/).map(w=>w.replace(/^[.\-]+|[.\-]+$/g,'')).filter(w=>w.length>1||/\d/.test(w));
  return {phrases, words, stems:words.map(stem)};
}
// «12.8», «ст 13», «статья 12.8», «ст.20.1» → номер статьи
function articleNum(q){
  const m = norm(q).trim().match(/^(?:ст(?:атья|\.)?\s*)?(\d+(?:\.\d+)*(?:-\d+)?)\.?$/);
  return m ? m[1] : null;
}
const isL = c => c && /[0-9a-zа-я]/.test(c);
// вхождение s в text только с начала слова; возвращает число вхождений (до max)
function countWord(text, s, max){
  let n=0, i=-1;
  while((i=text.indexOf(s,i+1))!==-1){ if(!isL(text[i-1])){ if(++n>=max) break } }
  return n;
}
function searchIn(d, Q){
  const out=[];
  if(!Q.words.length && !Q.phrases.length) return out;
  for(const a of d.arts){
    let score=0, ok=true, allT=true;
    for(const p of Q.phrases){
      const inT=countWord(a.ntitle,p,1), inB=countWord(a.nbody,p,1);
      if(!inT&&!inB){ok=false;break}
      if(!inT) allT=false;
      score += inT?40:10;
    }
    if(!ok) continue;
    for(const s of Q.stems){
      const inT=countWord(a.ntitle,s,1), cnt=countWord(a.nbody,s,10);
      if(!inT && !cnt){ok=false;break}
      if(!inT) allT=false;
      score += (inT?30:0) + cnt;
    }
    if(!ok) continue;
    if(allT) score += 100;
    if(a.lost) score -= 50;
    out.push({a,score});
  }
  out.sort((x,y)=>y.score-x.score || x.a.idx-y.a.idx);
  return out;
}
function terms(Q){ return [...Q.phrases, ...Q.stems].filter(Boolean).sort((a,b)=>b.length-a.length) }
function hlRegex(Q){
  const t = terms(Q); if(!t.length) return null;
  const parts = t.map(s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&').replace(/е/g,'[её]'));
  return new RegExp('(^|[^0-9a-zа-яё])((?:'+parts.join('|')+')[0-9а-яёa-z]*)','gi');
}
function highlight(text, re){ const e=esc(text); return re? e.replace(re,'$1<mark>$2</mark>') : e }
function snippet(a, Q, re){
  const body=a.plain, nb=a.nbody; let pos=-1;
  for(const t of terms(Q)){let i=-1; while((i=nb.indexOf(t,i+1))!==-1 && isL(nb[i-1])); if(i!==-1 && (pos===-1||i<pos)) pos=i}
  if(pos===-1) return highlight(body.slice(0,160)+(body.length>160?'…':''), re);
  const st=Math.max(0,pos-70), en=Math.min(body.length,pos+150);
  return (st>0?'…':'')+highlight(body.slice(st,en).replace(/\n/g,' '), re)+(en<body.length?'…':'');
}

/* ======================= Роутер ======================= */
// #/            главная
// #/fzop        НПА: оглавление (+ ?q= поиск)
// #/fzop/12.8   статья
function route(){
  const h = decodeURIComponent(location.hash.slice(1) || '/');
  const [path, qs] = h.split('?');
  const q = new URLSearchParams(qs||'').get('q') || '';
  const p = path.split('/').filter(Boolean);
  window.scrollTo(0,0);
  if(!p.length) return home(q);
  const npa = NPA.find(n=>n.id===p[0]);
  if(!npa) return home('');
  if(p[1]) return article(npa, p.slice(1).join('/'), q);
  return npaView(npa, q);
}
window.addEventListener('hashchange', route);
const go = h => { location.hash = h };
const setQ = (base,q) => history.replaceState(null,'','#'+base+(q?'?q='+encodeURIComponent(q):''));

/* ======================= Главная ======================= */
function home(q){
  document.title='Сборник НПА для курсантов';
  const favs = store.get('favs',[]);
  app.innerHTML = `
  <header class="hero"><div class="wrap">
    <svg class="emblem" viewBox="0 0 64 64" fill="none"><path d="M32 4 8 13v17c0 15 10.5 25.5 24 30 13.5-4.5 24-15 24-30V13z" fill="rgba(255,255,255,.12)" stroke="#d9b45a" stroke-width="2.5"/><path d="M22 22h20M22 30h20M22 38h13" stroke="#fff" stroke-width="3" stroke-linecap="round"/></svg>
    <h1>Сборник важных нормативно правовых актов для курсантов</h1>
    <p class="uni">Московский ордена Почета университет МВД России имени В.Я.&nbsp;Кикотя</p>
    <span class="by">by Karacikov</span>
  </div></header>
  <div class="wrap">
    <div class="gsearch"><label class="field" id="gf">${ICON.search}
      <input id="gq" type="search" enterkeyhint="search" autocomplete="off" placeholder="Поиск по всем НПА или номер статьи" value="${esc(q)}">
      <button class="clear" aria-label="Очистить">${ICON.x}</button></label></div>
    <div id="gres"></div>
    <div id="homeMain">
      <div class="sec-title">Нормативные правовые акты</div>
      <div class="npa-list">${NPA.map(n=>`
        <button class="npa-btn" data-id="${n.id}">
          <div class="npa-ico ${n.alt?'alt':''}">${esc(n.badge)}</div>
          <div class="npa-txt"><b>${esc(n.short)}</b><span>${esc(n.full)}</span><em>${esc(n.edition||'')}</em></div>
          <span class="chev">${ICON.chev}</span>
        </button>`).join('')}
      </div>
      ${favs.length?`<div class="sec-title">Избранные статьи</div><div class="favs">${favs.map(f=>`
        <button class="fav" data-h="/${f.id}/${esc(f.num)}"><small>${esc(NPA.find(n=>n.id===f.id)?.badge||'')} ст.&nbsp;${esc(f.num)}</small><span>${esc(f.title)}</span></button>`).join('')}</div>`:''}
    </div>
    <div class="foot">Тексты — по данным СПС КонсультантПлюс.<br>Сверяйтесь с официальным опубликованием.</div>
  </div>`;
  app.querySelectorAll('.npa-btn').forEach(b=>b.onclick=()=>go('/'+b.dataset.id));
  app.querySelectorAll('.fav').forEach(b=>b.onclick=()=>go(b.dataset.h));
  bindSearch('#gf','#gq', v=>{ setQ('/',v); globalSearch(v) });
  if(q) globalSearch(q);
}
async function globalSearch(q){
  const box=$('#gres'), main=$('#homeMain');
  if(!q.trim()){box.innerHTML='';main.classList.remove('hide');return}
  main.classList.add('hide');
  box.innerHTML='<div class="loading"><div class="spin"></div>Ищу…</div>';
  const Q=parseQuery(q), re=hlRegex(Q), num=articleNum(q);
  let html='', total=0, all=[];
  for(const n of NPA){
    let d; try{d=await load(n.id)}catch(e){continue}
    if(num && d.byNum[num]){const a=d.byNum[num]; html+=resItem(n,a,Q,re,true,q)}
    if(num) continue;
    searchIn(d,Q).forEach(x=>all.push({n,...x}));
  }
  if($('#gq')?.value!==q) return; // пользователь уже печатает дальше
  all.sort((x,y)=>y.score-x.score);
  total=all.length;
  renderResults(box, html, all, Q, re, q, total);
}
function resItem(n,a,Q,re,direct,q){
  return `<button class="res ${direct?'direct':''}" data-h="/${n.id}/${esc(a.num)}${q&&!direct?'?q='+encodeURIComponent(q):''}">
    <div class="h"><span class="tag ${n.alt?'alt':''}">${esc(n.badge)}</span><i>Статья ${esc(a.num)}.</i> ${highlight(a.title,direct?null:re)}</div>
    ${direct?'':`<div class="s">${snippet(a,Q,re)}</div>`}</button>`;
}
function renderResults(box, head, list, Q, re, q, total){
  let shown=0;
  const draw=()=>{
    const chunk=list.slice(shown,shown+40).map(x=>resItem(x.n,x.a,Q,re,false,q)).join('');
    shown+=40;
    box.querySelector('.more')?.remove();
    box.insertAdjacentHTML('beforeend', chunk + (shown<list.length?`<button class="more">Показать ещё (${list.length-shown})</button>`:''));
    box.querySelector('.more')?.addEventListener('click',draw);
    box.querySelectorAll('.res:not([data-b])').forEach(b=>{b.dataset.b=1;b.onclick=()=>go(b.dataset.h)});
  };
  box.innerHTML = head + `<div class="res-info">${total?'Найдено статей: '+total:(head?'':'<div class="empty">Ничего не найдено.<br>Попробуйте другое слово или номер статьи.</div>')}</div>`;
  draw();
}
function bindSearch(fieldSel, inputSel, cb){
  const f=$(fieldSel), i=$(inputSel), c=f.querySelector('.clear');
  const upd=()=>f.classList.toggle('has',!!i.value);
  let t; i.addEventListener('input',()=>{upd();clearTimeout(t);t=setTimeout(()=>cb(i.value),220)});
  i.addEventListener('keydown',e=>{if(e.key==='Enter'){clearTimeout(t);cb(i.value);i.blur()}});
  c.onclick=e=>{e.preventDefault();i.value='';upd();cb('');i.focus()};
  upd();
}

/* ======================= Страница НПА ======================= */
async function npaView(n, q){
  document.title=n.short;
  app.innerHTML = `
  <div class="bar"><div class="wrap">
    <div class="bar-row"><button class="ib" id="bk" aria-label="Назад">${ICON.back}</button>
      <div class="bar-title">${esc(n.short)}<small id="ed">${esc(n.edition||'')}</small></div></div>
    <div class="bar-search"><label class="field" id="nf">${ICON.search}
      <input id="nq" type="search" enterkeyhint="search" autocomplete="off" placeholder="Поиск в ${esc(n.badge)} или номер статьи" value="${esc(q)}">
      <button class="clear" aria-label="Очистить">${ICON.x}</button></label></div>
  </div></div>
  <div class="wrap"><div id="nres"></div><div id="toc" class="toc"><div class="loading"><div class="spin"></div>Загружаю текст…</div></div></div>`;
  $('#bk').onclick=()=>go('/');
  let d;
  try{ d=await load(n.id) }catch(e){ $('#toc').innerHTML='<div class="empty">Текст этого НПА ещё не загружен на сайт.</div>'; return }
  $('#ed').textContent=n.edition||d.edition||'';
  renderToc(n,d);
  const run=v=>{
    setQ('/'+n.id,v);
    const box=$('#nres'), toc=$('#toc');
    if(!v.trim()){box.innerHTML='';toc.classList.remove('hide');return}
    toc.classList.add('hide');
    const Q=parseQuery(v), re=hlRegex(Q), num=articleNum(v);
    const head = num&&d.byNum[num] ? resItem(n,d.byNum[num],Q,re,true,'') : '';
    const list = num ? [] : searchIn(d,Q).map(x=>({n,...x}));
    renderResults(box, head, list, Q, re, v, list.length);
  };
  bindSearch('#nf','#nq',run);
  if(q) run(q);
}
function renderToc(n,d){
  const open = new Set(store.get('open_'+n.id,[]));
  let html='', grp=null, gi=0;
  const close=()=>{ if(grp){ html+=`<div class="grp ${open.has(grp.k)?'open':''}" data-k="${grp.k}">
      <button>${ICON.chev}<span class="t">${grp.sub?`<small>${esc(grp.sub)}</small>`:''}${esc(grp.title)}</span><span class="n">${grp.arts.length}</span></button>
      <div class="arts">${grp.arts.join('')}</div></div>`; grp=null } };
  for(const it of d.items){
    if(it.type==='part'||it.type==='section'){ close(); html+=`<div class="part-h">${esc(it.title)}</div>` }
    else if(it.type==='chapter'){ close(); grp={k:'g'+(gi++), title:it.title, sub:it.label, arts:[]} }
    else if(it.type==='article'){
      if(!grp) grp={k:'g'+(gi++), title:'Общие положения', arts:[]};
      grp.arts.push(`<button class="art-link ${it.lost?'lost':''}" data-num="${esc(it.num)}"><b>${esc(it.num)}</b><span>${esc(it.title)}</span></button>`);
    }
  }
  close();
  const toc=$('#toc'); toc.innerHTML=html;
  toc.querySelectorAll('.grp>button').forEach(b=>b.onclick=()=>{
    const g=b.parentElement; g.classList.toggle('open');
    const k=[...toc.querySelectorAll('.grp.open')].map(x=>x.dataset.k); store.set('open_'+n.id,k);
  });
  toc.querySelectorAll('.art-link').forEach(b=>b.onclick=()=>go('/'+n.id+'/'+b.dataset.num));
}

/* ======================= Статья ======================= */
async function article(n, num, q){
  app.innerHTML = `<div class="bar"><div class="wrap"><div class="bar-row">
    <button class="ib" id="bk" aria-label="Назад">${ICON.back}</button>
    <div class="bar-title">Ст. ${esc(num)}<small>${esc(n.short)}</small></div>
    <div class="hl-nav" id="hln"><button class="ib" id="hp">${ICON.up}</button><span id="hc"></span><button class="ib" id="hn">${ICON.down}</button></div>
    <button class="ib" id="fav" aria-label="В избранное">${ICON.star}</button>
    <button class="ib" id="fnt" aria-label="Размер шрифта">${ICON.font}</button>
    <button class="ib" id="lnk" aria-label="Ссылка">${ICON.share}</button>
  </div></div></div>
  <div class="wrap"><div class="article" id="art"><div class="loading"><div class="spin"></div></div></div></div>`;
  $('#bk').onclick=()=>{ if(sessionStorage.getItem('nav')) history.back(); else go('/'+n.id) };
  let d; try{d=await load(n.id)}catch(e){$('#art').innerHTML='<div class="empty">Текст не загружен.</div>';return}
  const a=d.byNum[num];
  if(!a){$('#art').innerHTML='<div class="empty">Статья '+esc(num)+' не найдена.</div>';return}
  document.title='Ст. '+a.num+' '+n.badge;
  const Q=q?parseQuery(q):null, re=Q?hlRegex(Q):null;
  const crumb=a.path.map(x=>(x.label?x.label+'. ':'')+x.title).join(' › ');
  $('#art').innerHTML=`
    <div class="a-crumb">${esc(crumb)}</div>
    <h2 class="a-title">Статья ${esc(a.num)}. ${highlight(a.title,re)}</h2>
    <div class="a-body">${a.text.map(p=>{
      const cls = /^КонсультантПлюс: примечание/i.test(p)?'cons' : /^\((в ред\.|введен|введена|введено|п\.|ч\.|часть|абзац|утратил|см\.|пп\.)/i.test(p)?'note' : /^утратил[аио]? силу/i.test(p)?'lost':'';
      return `<p class="${cls}">${highlight(p,re)}</p>`}).join('')}</div>
    <div class="a-nav"><div class="wrap">
      <button id="pv" ${a.idx?'':'disabled'}>‹ ст. ${esc(d.arts[a.idx-1]?.num||'')}</button>
      <button id="tc">Оглавление</button>
      <button id="nx" ${d.arts[a.idx+1]?'':'disabled'}>ст. ${esc(d.arts[a.idx+1]?.num||'')} ›</button>
    </div></div>`;
  const qs=q?'?q='+encodeURIComponent(q):'';
  $('#pv').onclick=()=>go('/'+n.id+'/'+d.arts[a.idx-1].num+qs);
  $('#nx').onclick=()=>go('/'+n.id+'/'+d.arts[a.idx+1].num+qs);
  $('#tc').onclick=()=>go('/'+n.id);
  // избранное
  const favBtn=$('#fav');
  const isFav=()=>store.get('favs',[]).some(f=>f.id===n.id&&f.num===a.num);
  const paint=()=>favBtn.innerHTML=isFav()?ICON.starf:ICON.star; paint();
  favBtn.onclick=()=>{let f=store.get('favs',[]); if(isFav()){f=f.filter(x=>!(x.id===n.id&&x.num===a.num));toast('Убрано из избранного')} else {f.unshift({id:n.id,num:a.num,title:a.title});toast('Добавлено в избранное')} store.set('favs',f.slice(0,50)); paint()};
  // шрифт
  $('#fnt').onclick=()=>{fs=fs>=23?15:fs+2; document.documentElement.style.setProperty('--fs',fs+'px'); store.set('fs',fs); toast('Размер текста: '+fs)};
  // ссылка
  $('#lnk').onclick=async()=>{
    const url=location.href.split('#')[0]+'#/'+n.id+'/'+a.num;
    const text=n.badge+', ст. '+a.num+'. '+a.title;
    try{ if(navigator.share){await navigator.share({title:text,url});return} await navigator.clipboard.writeText(text+'\n'+url); toast('Ссылка скопирована') }catch(e){}
  };
  // навигация по совпадениям
  const marks=[...document.querySelectorAll('.a-body mark')];
  if(marks.length){
    let cur=-1; const hln=$('#hln'); hln.classList.add('on');
    const show=i=>{ marks[cur]?.classList.remove('cur'); cur=(i+marks.length)%marks.length; const m=marks[cur]; m.classList.add('cur');
      const y=m.getBoundingClientRect().top+scrollY-140; scrollTo({top:y,behavior:'smooth'}); $('#hc').textContent=(cur+1)+'/'+marks.length };
    $('#hp').onclick=()=>show(cur-1); $('#hn').onclick=()=>show(cur+1);
    setTimeout(()=>show(0),60);
  }
}
window.addEventListener('hashchange',()=>sessionStorage.setItem('nav','1'),{once:true});

route();
if('serviceWorker' in navigator && location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
